<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>防災識安所：避難所規劃</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1F3A6B; touch-action: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #BFD6EE; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
               color: #fff; font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; }
    #loading .t { font-size: 22px; font-weight: 700; letter-spacing: .1em; }
    #loading .bar { width: min(320px, 70vw); height: 10px; border-radius: 6px; background: rgba(255,255,255,.25); overflow: hidden; }
    #loading .fill { height: 100%; width: 0; background: #F6B23C; border-radius: 6px; transition: width .2s; }
    #loading .hint { font-size: 14px; opacity: .8; }
    #error { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); background: #D64545; color: #fff; padding: 10px 16px;
             border-radius: 10px; font-family: sans-serif; display: none; z-index: 9; max-width: 90vw; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div class="t">防災識安所：避難所規劃</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="hint">載入中…手機請橫向使用</div>
  </div>
  <div id="error"></div>
  <script>
    // 全畫面自適應：畫布永遠填滿瀏覽器視窗，手機、平板、電腦皆適用
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "防災識安所",
      productName: "防災識安所：避難所規劃",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      showBanner: function (msg, type) {
        if (type === "error") { var e = document.getElementById("error"); e.textContent = msg; e.style.display = "block"; }
      },
    };
    // 高解析度手機上限制像素比，避免畫面過重
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = (100 * p) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
      }).catch(function (message) {
        var e = document.getElementById("error"); e.textContent = message; e.style.display = "block";
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
