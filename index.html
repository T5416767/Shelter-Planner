<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>防災識安所：避難所規劃</title>
  <style>
    :root { --navy: #1F3A6B; --navy-dark: #152A50; --yellow: #F6B23C; --bg: #F4F6FB; --sub: #5D6678; --line: #DCE2EE; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: linear-gradient(160deg, #DCE8F7 0%, var(--bg) 55%, #E3F1E4 100%);
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      color: var(--navy); display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      width: min(560px, 100%); background: #fff; border-radius: 22px; padding: 40px 36px 32px;
      box-shadow: 0 10px 30px rgba(31, 58, 107, .14); text-align: center;
    }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 46px); letter-spacing: .06em; }
    .sub { margin: 6px 0 0; font-size: clamp(18px, 4.5vw, 24px); font-weight: 700; }
    .bar { width: 120px; height: 5px; background: var(--yellow); border-radius: 3px; margin: 16px auto 22px; }
    .desc { margin: 0 0 26px; color: var(--sub); font-size: 16px; line-height: 1.7; }
    a.btn {
      display: block; text-decoration: none; border-radius: 14px; padding: 16px 18px; margin-top: 12px;
      font-size: 20px; font-weight: 700; transition: transform .1s, filter .1s;
    }
    a.btn:hover { filter: brightness(.96); transform: translateY(-1px); }
    a.primary { background: var(--yellow); color: var(--navy); }
    a.secondary { background: var(--bg); color: var(--navy); border: 1px solid var(--line); }
    .small { display: block; font-size: 14px; font-weight: 400; color: var(--sub); margin-top: 4px; }
    a.primary .small { color: var(--navy-dark); opacity: .8; }
    .note { margin-top: 22px; color: var(--sub); font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <h1>防災識安所</h1>
    <p class="sub">避難所規劃</p>
    <div class="bar"></div>
    <p class="desc">在學校體育館規劃一座避難所，<br>觀察居民的行動，找出問題並改善。</p>
    <a class="btn primary" href="v2.0/">開始體驗（最新版 2.0）<span class="small">2026/10/26</span></a>
    <a class="btn secondary" href="v1.1.0/">舊版 1.1.0<span class="small">2026/10/17</span></a>
    <p class="note">建議使用電腦，或將手機、平板橫向使用。<br>第一次載入需要一點時間，請耐心等候。</p>
  </main>
</body>
</html>
